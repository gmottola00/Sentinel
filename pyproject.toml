[project]
name = "sentinel-watch"
version = "0.1.0"
description = "Satellite change detection with Sentinel-2 and Claude Vision"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    "numpy>=1.26.0",
    "Pillow>=10.3.0",
    "rasterio>=1.3.10",
    "shapely>=2.0.0",
    "python-dotenv>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
