services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel_watch
    ports:
      - "5432:5432"
    volumes:
      - sentinel_watch_pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_watch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sentinel_watch_pgdata:
